# Thermite local deployment: one rig (harness + supervisor) and the control service.
# Run `npm run dev:init` first; it writes local tokens to .dev/secrets/ (git-ignored).
# Works with `docker compose`, `podman compose` and podman-compose.
name: thermite

services:
  control:
    build: { context: ., dockerfile: containers/control/Containerfile, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_CONTROL_DIR: /var/lib/thermite-control
      THERMITE_CONTROL_LISTEN: 0.0.0.0:8800
      # Locally the owner's token is a file; deployed, give only its hash instead
      # (THERMITE_CONTROL_ADMIN_TOKEN_SHA256, from `thermite token new`).
      THERMITE_CONTROL_ADMIN_TOKEN_FILE: /run/secrets/control-admin-token
      THERMITE_CONTROL_OPERATOR_TOKEN_FILE: /run/secrets/control-operator-token
      THERMITE_CONTROL_RIG_TOKENS_FILE: /run/secrets/control-rig-tokens
      THERMITE_CONTROL_PUBKEY_EXPORT: /keys/control-signing.pub
      THERMITE_CONTROL_STALE_SECONDS: "${THERMITE_CONTROL_STALE_SECONDS:-180}"
      THERMITE_CONTROL_OFFLINE_SECONDS: "${THERMITE_CONTROL_OFFLINE_SECONDS:-900}"
      # Control's address as rigs and the machines it sets rigs up on reach it.
      THERMITE_CONTROL_PUBLIC_URL: "${THERMITE_CONTROL_PUBLIC_URL:-}"
      # The images control deploys rigs from on machines (Rigs › Add a rig).
      THERMITE_RIG_HARNESS_IMAGE: "${THERMITE_RIG_HARNESS_IMAGE:-}"
      THERMITE_RIG_HARNESS_CUDA_IMAGE: "${THERMITE_RIG_HARNESS_CUDA_IMAGE:-}"
      THERMITE_RIG_SUPERVISOR_IMAGE: "${THERMITE_RIG_SUPERVISOR_IMAGE:-}"
      # The one-container rig image control launches rigs on RunPod from (empty: each launch
      # names its image).
      THERMITE_RUNPOD_RIG_IMAGE: "${THERMITE_RUNPOD_RIG_IMAGE:-}"
      # The image a RunPod test pod runs (empty: each test names its image).
      THERMITE_RUNPOD_TEST_IMAGE: "${THERMITE_RUNPOD_TEST_IMAGE:-}"
      # "1": the owner accepts each rig's first report key on the dashboard.
      THERMITE_CONTROL_REQUIRE_KEY_ACCEPT: "${THERMITE_CONTROL_REQUIRE_KEY_ACCEPT:-}"
      THERMITE_CONTROL_SESSION_DAYS: "${THERMITE_CONTROL_SESSION_DAYS:-}"
      # Restarts through the container engine: see compose.lifecycle.yaml (off by default).
      THERMITE_LIFECYCLE: "${THERMITE_LIFECYCLE:-}"
      THERMITE_COMPOSE_PROJECT: thermite
      THERMITE_COMPOSE_SERVICES: '{"local-1":{"harness":"harness","supervisor":"supervisor"},"local-2":{"harness":"harness-2","supervisor":"supervisor-2"}}'
      # The message bus, with the `bus` profile: nats://nats:4222. Empty: HTTP alone.
      THERMITE_NATS_URL: "${THERMITE_NATS_URL:-}"
      # With the bus, control writes its users here (each rig's key), and the server includes it.
      THERMITE_NATS_USERS_FILE: /nats-users/users.conf

    volumes:
      - control-state:/var/lib/thermite-control
      - control-pub:/keys
      - nats-users:/nats-users
    secrets: [control-admin-token, control-operator-token, control-rig-tokens]
    ports: ["127.0.0.1:${THERMITE_CONTROL_PORT:-8800}:8800"]
    networks: [control]
    # Control lists model providers' models: a provider on this machine is at host.docker.internal
    # (with Podman, host.containers.internal too).
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # The message bus (goal 168): NATS with JetStream, for control. With the `bus` profile and
  # THERMITE_NATS_URL=nats://nats:4222, the supervisors send their reports and live lines here and
  # take their commands and their rig's config from here; control folds the reports and the live
  # lines, publishes the commands and writes each rig's config, sealed to the rig. It is on the
  # control network only: the harness never reaches it. It knows only the
  # users control writes to its users file: control's own, and one for each rig whose supervisor
  # registered its key.
  nats:
    profiles: [bus]
    image: docker.io/library/nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    # Its settings are written as it starts, beside the users file it includes: the largest message
    # (REPORT_MAX_BYTES in src/core/link/report.ts), monitoring on its own loopback for the health
    # check, JetStream's store on its volume, and the users. It starts once control has written
    # them, and reads them again when control asks.
    command:
      - sh
      - -c
      - |
        cat > /etc/nats/thermite.conf <<'EOF'
        max_payload: 8388608
        http: 127.0.0.1:8222
        jetstream { store_dir: /data }
        include users/users.conf
        EOF
        trap 'exit 0' TERM INT
        # Control writes the users as its own user (10001): the folder is given to it here, since
        # not every engine gives a new volume the owner its first container's image has.
        chown 10001:10001 /etc/nats/users
        [ -s /etc/nats/users/users.conf ] || echo "waiting for control to write the bus's users"
        until [ -s /etc/nats/users/users.conf ]; do sleep 1; done
        exec nats-server -c /etc/nats/thermite.conf
    volumes:
      - nats-data:/data
      - nats-users:/etc/nats/users
    # Control first: it writes the users file.
    depends_on: [control]
    networks: [control]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    # Only to give the users' folder to control's user as it starts (above).
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  harness:
    build: { context: ., dockerfile: containers/harness/Containerfile, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-1
      THERMITE_TARGET: cpu
      THERMITE_CONTROL_PUBKEY_FILE: /keys/control-signing.pub
      THERMITE_SUPERVISOR_TOKEN_FILE: /run/secrets/harness-supervisor-token
      THERMITE_PROPOSER_TOKEN_FILE: /run/secrets/harness-proposer-token
      # The promotion policy is the operator's call; locally the acceptance test sets auto.
      THERMITE_PROMOTION: "${THERMITE_PROMOTION:-auto}"
      THERMITE_CALIBRATION_BLOCKS: "${THERMITE_CALIBRATION_BLOCKS:-6}"
      # The model route for agents (empty: agents off): an OpenAI-compatible endpoint with tool
      # calling, its URL ending in /v1. The key comes from a secret file. A server on this
      # machine is http://host.docker.internal:PORT/v1 (Podman: host.containers.internal too).
      THERMITE_MODEL_BASE_URL: "${THERMITE_MODEL_BASE_URL:-}"
      THERMITE_MODEL: "${THERMITE_MODEL:-}"
      THERMITE_MODEL_API_KEY_FILE: /run/secrets/model-api-key
      THERMITE_MODEL_CONTEXT_WINDOW: "${THERMITE_MODEL_CONTEXT_WINDOW:-0}"
      THERMITE_MODEL_MAX_TOKENS: "${THERMITE_MODEL_MAX_TOKENS:-}"
      THERMITE_MODEL_REASONING_EFFORT: "${THERMITE_MODEL_REASONING_EFFORT:-}"
      THERMITE_MAX_TRIALS: "${THERMITE_MAX_TRIALS:-1}"
      THERMITE_TRIAL_MINUTES: "${THERMITE_TRIAL_MINUTES:-}"
      THERMITE_MAX_TURNS: "${THERMITE_MAX_TURNS:-}"
      THERMITE_RESEARCH_MAX_MB: "${THERMITE_RESEARCH_MAX_MB:-}"
      THERMITE_LLM_USD_PER_MTOK_IN: "${THERMITE_LLM_USD_PER_MTOK_IN:-}"
      THERMITE_LLM_USD_PER_MTOK_OUT: "${THERMITE_LLM_USD_PER_MTOK_OUT:-}"
      THERMITE_EXPORT_MINUTES: "${THERMITE_EXPORT_MINUTES:-60}"
    # A model server on this machine (native Linux Docker lacks the name otherwise).
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - harness-state:/var/lib/thermite
      - harness-scratch:/scratch
      - ./.dev/inbox:/inbox:ro
      - outbox:/outbox
      - control-pub:/keys:ro
    secrets: [harness-supervisor-token, harness-proposer-token, model-api-key]
    # No published ports: only the rig's supervisor reaches the harness.
    networks: [rig, egress]
    # The broker's needs only: separate users for roles, ownership of scratch, killing leftovers.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  supervisor:
    build: { context: ., dockerfile: containers/supervisor/Containerfile, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-1
      HARNESS_URL: http://harness:8700
      CONTROL_URL: http://control:8800
      THERMITE_POLL_SECONDS: "${THERMITE_POLL_SECONDS:-60}"
      # Commands (pause, messages, checks) are fetched on their own, shorter interval.
      THERMITE_COMMAND_POLL_SECONDS: "${THERMITE_COMMAND_POLL_SECONDS:-5}"
      THERMITE_MODEL_ROUTE_POLL_SECONDS: "${THERMITE_MODEL_ROUTE_POLL_SECONDS:-30}"
      THERMITE_LIVE_INTERVAL_MS: "${THERMITE_LIVE_INTERVAL_MS:-3000}"
      # How often past research comes from control into each running run's knowledge/ (0: off).
      THERMITE_KB_SYNC_SECONDS: "${THERMITE_KB_SYNC_SECONDS:-180}"
      THERMITE_HARNESS_TOKEN_FILE: /run/secrets/harness-supervisor-token
      THERMITE_CONTROL_TOKEN_FILE: /run/secrets/control-rig-token
      # Locally, both rigs' supervisors push to one results repository on a shared volume.
      THERMITE_RESULTS_REMOTE: "${THERMITE_RESULTS_REMOTE:-file:///results/results.git}"
      # The advisors: teachers, their merged by model, auditor and review panel (off unless a config file is given).
      THERMITE_ADVISORS_FILE: "${THERMITE_ADVISORS_FILE:-}"
      # With the `bus` profile, nats://nats:4222: reports, commands, live lines and config go over it.
      # Empty: HTTP.
      THERMITE_NATS_URL: "${THERMITE_NATS_URL:-}"
    volumes:
      - supervisor-home:/var/lib/thermite-supervisor
      - ./.dev/inbox:/inbox
      - outbox:/outbox:ro
      - results:/results
      - ./.dev/advisors:/etc/thermite/advisors:ro
    secrets: [harness-supervisor-token, control-rig-token]
    networks: [rig, control, egress]
    depends_on: [harness, control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # A second rig for multi-rig checks: `docker compose --profile two-rigs up`.
  harness-2:
    profiles: [two-rigs]
    build: { context: ., dockerfile: containers/harness/Containerfile, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-2
      THERMITE_TARGET: cpu
      THERMITE_CONTROL_PUBKEY_FILE: /keys/control-signing.pub
      THERMITE_SUPERVISOR_TOKEN_FILE: /run/secrets/harness2-supervisor-token
      THERMITE_PROPOSER_TOKEN_FILE: /run/secrets/harness2-proposer-token
      THERMITE_PROMOTION: "${THERMITE_PROMOTION:-auto}"
      THERMITE_CALIBRATION_BLOCKS: "${THERMITE_CALIBRATION_BLOCKS:-6}"
      # The same model route as the first rig.
      THERMITE_MODEL_BASE_URL: "${THERMITE_MODEL_BASE_URL:-}"
      THERMITE_MODEL: "${THERMITE_MODEL:-}"
      THERMITE_MODEL_API_KEY_FILE: /run/secrets/model-api-key
      THERMITE_MODEL_CONTEXT_WINDOW: "${THERMITE_MODEL_CONTEXT_WINDOW:-0}"
      THERMITE_MODEL_MAX_TOKENS: "${THERMITE_MODEL_MAX_TOKENS:-}"
      THERMITE_MODEL_REASONING_EFFORT: "${THERMITE_MODEL_REASONING_EFFORT:-}"
      THERMITE_MAX_TRIALS: "${THERMITE_MAX_TRIALS:-1}"
      THERMITE_TRIAL_MINUTES: "${THERMITE_TRIAL_MINUTES:-}"
      THERMITE_MAX_TURNS: "${THERMITE_MAX_TURNS:-}"
      THERMITE_EXPORT_MINUTES: "${THERMITE_EXPORT_MINUTES:-60}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - harness2-state:/var/lib/thermite
      - harness2-scratch:/scratch
      - ./.dev/inbox:/inbox:ro
      - outbox2:/outbox
      - control-pub:/keys:ro
    secrets: [harness2-supervisor-token, harness2-proposer-token, model-api-key]
    networks: [rig2, egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  supervisor-2:
    profiles: [two-rigs]
    build: { context: ., dockerfile: containers/supervisor/Containerfile, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-2
      HARNESS_URL: http://harness-2:8700
      CONTROL_URL: http://control:8800
      THERMITE_POLL_SECONDS: "${THERMITE_POLL_SECONDS:-60}"
      # Commands (pause, messages, checks) are fetched on their own, shorter interval.
      THERMITE_COMMAND_POLL_SECONDS: "${THERMITE_COMMAND_POLL_SECONDS:-5}"
      THERMITE_MODEL_ROUTE_POLL_SECONDS: "${THERMITE_MODEL_ROUTE_POLL_SECONDS:-30}"
      THERMITE_LIVE_INTERVAL_MS: "${THERMITE_LIVE_INTERVAL_MS:-3000}"
      THERMITE_KB_SYNC_SECONDS: "${THERMITE_KB_SYNC_SECONDS:-180}"
      THERMITE_HARNESS_TOKEN_FILE: /run/secrets/harness2-supervisor-token
      THERMITE_CONTROL_TOKEN_FILE: /run/secrets/control-rig-token-2
      THERMITE_RESULTS_REMOTE: "${THERMITE_RESULTS_REMOTE:-file:///results/results.git}"
      THERMITE_ADVISORS_FILE: "${THERMITE_ADVISORS_FILE:-}"
      # With the `bus` profile, nats://nats:4222: reports, commands, live lines and config go over it.
      # Empty: HTTP.
      THERMITE_NATS_URL: "${THERMITE_NATS_URL:-}"
    volumes:
      - supervisor2-home:/var/lib/thermite-supervisor
      - ./.dev/inbox:/inbox
      - outbox2:/outbox:ro
      - results:/results
      - ./.dev/advisors:/etc/thermite/advisors:ro
    secrets: [harness2-supervisor-token, control-rig-token-2]
    networks: [rig2, control, egress]
    depends_on: [harness-2, control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  rig: { internal: true }
  rig2: { internal: true }
  control: {}
  egress: {}

volumes:
  control-state: {}
  control-pub: {}
  harness-state: {}
  harness-scratch: {}
  outbox: {}
  supervisor-home: {}
  harness2-state: {}
  harness2-scratch: {}
  outbox2: {}
  supervisor2-home: {}
  results: {}
  nats-data: {}
  nats-users: {}

secrets:
  control-admin-token: { file: ./.dev/secrets/control-admin-token }
  control-operator-token: { file: ./.dev/secrets/control-operator-token }
  control-rig-tokens: { file: ./.dev/secrets/control-rig-tokens.json }
  control-rig-token: { file: ./.dev/secrets/control-rig-token }
  harness-supervisor-token: { file: ./.dev/secrets/harness-supervisor-token }
  harness-proposer-token: { file: ./.dev/secrets/harness-proposer-token }
  # A local model route's key (git-ignored; dev-init writes a placeholder).
  model-api-key: { file: ./.dev/secrets/model-api-key }
  control-rig-token-2: { file: ./.dev/secrets/control-rig-token-2 }
  harness2-supervisor-token: { file: ./.dev/secrets/harness2-supervisor-token }
  harness2-proposer-token: { file: ./.dev/secrets/harness2-proposer-token }
