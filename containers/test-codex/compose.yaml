# Test only (scripts/codex-acceptance.mjs): the harness with a stand-in for the Codex CLI mounted,
# so the Codex harness runs end to end without a ChatGPT plan. The image is built without the
# real Codex (CODEX_VERSION empty), so the test downloads nothing for it.
services:
  harness:
    build:
      args:
        CODEX_VERSION: ""
    environment:
      THERMITE_CODEX_BIN: /opt/fake-codex/codex
    volumes:
      - ./containers/test-codex:/opt/fake-codex:ro
